name: Validate multi-output stacking features

on:
  push:
    branches:
      - validation/stacking-multioutput-features-20261115

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS_CI: true
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a45aa4a37ae27402c01050f63bb99d72dd8875cb
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Install frozen development environment
        run: uv sync --frozen --group dev --python 3.11
      - name: Show source and versions
        run: |
          git rev-parse HEAD
          uv run --group dev python -c "import sys,numpy,pandas,scipy,sklearn; print(sys.version); print('NumPy',numpy.__version__,'pandas',pandas.__version__,'SciPy',scipy.__version__,'sklearn',sklearn.__version__)"
      - name: Verify the same regressions fail on unchanged production source
        run: |
          uv run --group dev python - <<'PY'
          from pathlib import Path
          import subprocess

          paths = [Path(path) for path in ["mlxtend/classifier/_base_classification.py","mlxtend/classifier/stacking_classification.py","mlxtend/classifier/stacking_cv_classification.py"]]
          fixed = {path: path.read_bytes() for path in paths}
          try:
              for path in paths:
                  path.write_bytes(subprocess.check_output(
                      ["git", "show", "1aee767ef57b84a8191511a08955c583b65de382:" + str(path)]
                  ))
              run = subprocess.run(
                  ["python", "-m", "pytest",
                   "mlxtend/classifier/tests/test_stacking_multioutput_features.py",
                   "-q", "--tb=short"],
                  capture_output=True, text=True
              )
              print(run.stdout)
              print(run.stderr)
              if run.returncode != 1 or "ERROR" in run.stdout:
                  raise SystemExit("Expected failing tests without collection errors")
          finally:
              for path, content in fixed.items():
                  path.write_bytes(content)
          PY
      - name: Run stacking classifier regression tests
        run: uv run --group dev python -m pytest mlxtend/classifier/tests/test_stacking_classifier.py mlxtend/classifier/tests/test_stacking_cv_classifier.py mlxtend/classifier/tests/test_stacking_multioutput_features.py -q
      - name: Check changed Python style
        run: |
          uv run --group dev python -m black --target-version py311 --diff --check mlxtend/classifier/_base_classification.py mlxtend/classifier/stacking_classification.py mlxtend/classifier/stacking_cv_classification.py mlxtend/classifier/tests/test_stacking_multioutput_features.py
          uv run --group dev python -m isort --check-only -p mlxtend --line-length 88 --multi-line 3 --profile black mlxtend/classifier/_base_classification.py mlxtend/classifier/stacking_classification.py mlxtend/classifier/stacking_cv_classification.py mlxtend/classifier/tests/test_stacking_multioutput_features.py
          uv run --group dev python -m flake8 mlxtend/classifier/_base_classification.py mlxtend/classifier/stacking_classification.py mlxtend/classifier/stacking_cv_classification.py mlxtend/classifier/tests/test_stacking_multioutput_features.py
          git diff --exit-code
