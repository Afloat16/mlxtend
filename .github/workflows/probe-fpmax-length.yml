name: Explore maximal-itemset length filtering
on:
  push:
    branches:
      - validation/probe-fpmax-length-20261115
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1aee767ef57b84a8191511a08955c583b65de382
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --frozen --group dev --python 3.11
      - name: Compare limited output to exhaustive maximal-itemset oracle
        run: |
          uv run --group dev python - <<'PY'
          import itertools
          import numpy as np
          import pandas as pd
          from mlxtend.frequent_patterns import fpmax
          
          rng = np.random.RandomState(421)
          found = 0
          for iteration in range(1500):
              values = rng.randint(0, 2, (8, 6)).astype(bool)
              threshold = [0.25, 0.5, 0.75][iteration % 3]
              frequent = {}
              for size in range(1, values.shape[1] + 1):
                  for indices in itertools.combinations(range(values.shape[1]), size):
                      support = values[:, indices].all(axis=1).mean()
                      if support >= threshold:
                          frequent[frozenset(indices)] = support
              maximal = {items: support for items, support in frequent.items()
                         if not any(items < other for other in frequent)}
              for max_len in (1, 2, 3):
                  actual = fpmax(pd.DataFrame(values), min_support=threshold, max_len=max_len)
                  actual = dict(zip(actual["itemsets"], actual["support"]))
                  expected = {items: support for items, support in maximal.items()
                              if len(items) <= max_len}
                  if actual != expected:
                      print("MISMATCH", iteration, threshold, max_len, flush=True)
                      print("values", values.astype(int).tolist(), flush=True)
                      print("actual", actual, "expected", expected, flush=True)
                      found += 1
                      break
              if found >= 5:
                  break
          print("PROBE COMPLETE", iteration + 1, "datasets", found, "failures", flush=True)
          
          PY
